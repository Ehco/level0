<script>
'use strict';
/* ============================================================================
   LEVEL 0 — Infinite Backrooms. Single-file software raycaster.
   Sections in this file map to spec sections 3-11.
   All tuning constants are in TUNE (this section) unless noted inline.
   ========================================================================= */

/* ---------------------------------------------------------------- §9 budgets
   TIER table: [internal W, H, draw distance, floor casting on] */
var TIERS = [[320,180,24,true],[240,135,16,true],[200,112,12,false]];
var TUNE = {
  WALK:3.0, SPRINT:5.2,               // §6 player speeds (u/s)
  STAM_DRAIN:4.0, STAM_REGEN:6.0, STAM_MIN:0.15, // §6 stamina (s, s, fraction)
  P_RAD:0.2,                          // §6 player collision radius
  BOB_AMP:0.03, BOB_PITCH:2,          // §6 head bob (units, px)
  ROT_SPEED:2.8, MOUSE_SENS:0.0025,   // §6 fallback rotate speed / mouse
  M_ROAM:1.4, M_CHASE:4.4, M_RAD:0.28,// §7 monster speeds (u/s) + radius
  M_HEIGHT:2.2, M_WIDTH:1.1,          // §7 monster world size
  GRACE:20, ODO_SPAWN:30,             // §7 spawn gate: seconds | cells walked
  SPAWN_MIN:18, SPAWN_MAX:26,         // §7 spawn distance (u)
  DESPAWN_D:40, DESPAWN_T:60,         // §7 despawn distance/time
  CATCH_D:0.6,                        // §7 catch distance
  HEAR_D:10,                          // §7 sprint hearing distance
  LOSE_T:4,                           // §7 CHASE->SEARCH after LOS lost (s)
  REPATH:0.5,                         // §7 CHASE repath interval (s)
  SEARCH_WAIT:3, SEARCH_T:15,         // §7 search wait / give-up (s)
  ASTAR_WIN:21, ASTAR_CAP:256,        // §7 A* window / node cap
  BB_MIN:45, BB_VAR:75,               // §4.4 blackout interval 45-120 s
  BB_DUR_MIN:2, BB_DUR_VAR:2,         // §4.4 blackout duration 2-4 s
  BB_LIGHT:0.15,                      // §4.4 light level during blackout
  TIER_FPS2:28, TIER_FPS3:24,         // §9 auto-drop thresholds
  TIER_WINDOW:3, TIER_HYST:10,        // §9 averaging window / hysteresis (s)
  PRUNE_R:4, GEN_R:3, MAX_CHUNKS:49,  // §4.1 chunk radii + hard cap (7x7=49)
  FOV_PLANE:0.649                     // tan(FOV/2), FOV=66deg (§3.1)
};

/* ------------------------------------------------------------------- §2 audit
   Console capture so SELF_AUDIT can prove "zero console errors/warnings". */
var __errs = [];
(function(){
  function cap(kind){
    return function(){
      var a = [];
      for (var i = 0; i < arguments.length; i++) a.push(String(arguments[i]));
      __errs.push(kind + ': ' + a.join(' '));
      // keep real console behaviour
      var f = kind === 'error' ? console.error : console.warn;
      try { f.apply(console, a); } catch (e) {}
    };
  }
  console.error = cap('error');
  console.warn = cap('warn');
  window.onerror = function(m, s, l, c){ __errs.push('error: ' + m + ' @' + l + ':' + c); };
  window.addEventListener('unhandledrejection', function(e){
    __errs.push('error: unhandledrejection ' + e.reason);
  });
})();

/* --------------------------------------------------------------- §2 / §12 audit
   Throttled world log (drives the "prune verified by logging" checklist item). */
function logWorld(){
  console.log('[L0] t=' + G.time.toFixed(0) + 's chunks=' + chunks.size +
              ' pos=' + P.x.toFixed(1) + ',' + P.y.toFixed(1) +
              ' tier=' + (G.tier + 1) + ' mon=' + (M.active ? M.state : 'none'));
}

/* ------------------------------------------------------- deterministic hashing
   splitmix-style 32-bit mixing; all world randomness flows through here. */
function hash32(a, b, c, d){
  var h = (Math.imul(a | 0, 0x9E3779B1) ^ Math.imul(b | 0, 0x85EBCA77) ^
           Math.imul(c | 0, 0xC2B2AE3D) ^ (d | 0)) | 0;
  h = (h ^ (h >>> 15)) | 0;
  h = Math.imul(h, 0x27D4EB2D);
  h = (h ^ (h >>> 13)) | 0;
  return (h ^ (h >>> 16)) >>> 0;
}
/* mulberry32 PRNG seeded from hash32 — order independent per chunk */
function rngFrom(s){
  var a = s >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seedFromString(str){
  if (!str) return (Date.now() ^ (Math.random() * 0xffffffff)) >>> 0;
  var h = 2166136261, i;
  for (i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

/* ------------------------------------------------------------- §4 world model
   chunks: Map "cx,cy" -> {cells:Uint8Array(256), light:Uint8Array(16)}
   cell values: 0 floor, 1 wall, 2 solid pillar. 16x16 cells per chunk. */
var worldSeed = 1;
var chunks = new Map();
var lcx = 1e9, lcy = 1e9, lch = null;          // last-chunk cache (hot path)
var DBG = { gens:0, astarCalls:0, astarMaxNodes:0, astarOverflows:0 };

function chunkGet(cx, cy){
  if (cx === lcx && cy === lcy) return lch;
  var key = cx + ',' + cy;
  var ch = chunks.get(key);
  if (!ch){ ch = genChunk(cx, cy); chunks.set(key, ch); }
  lcx = cx; lcy = cy; lch = ch;
  return ch;
}
function invalidateChunkCache(){ lcx = 1e9; lcy = 1e9; lch = null; }

function cellAt(gx, gy){
  return chunkGet(gx >> 4, gy >> 4).cells[((gy & 15) << 4) + (gx & 15)];
}
function isSolid(gx, gy){ return cellAt(gx, gy) !== 0; }

/* §4.4 lighting: per 4x4-cell block, fixed-point multipliers */
function lightMulB(bx, by){
  var ch = chunkGet(bx >> 2, by >> 2);
  var v = ch.light[(by & 3) * 4 + (bx & 3)];
  return v === 2 ? 256 : (v === 1 ? 148 : 78);
}
function lightMul(gx, gy){
  return lightMulB(gx >> 2, gy >> 2);
}
function lightRaw(gx, gy){
  var ch = chunkGet(gx >> 4, gy >> 4);
  return ch.light[((gy >> 2) & 3) * 4 + ((gx >> 2) & 3)];
}

/* --------------------------------------------------- §4.2 pure edge openings
   openingsFor(vert, line, other): positions (1..14) of open cells on one edge.
   vert=true  -> vertical boundary at chunk-line x=line, between chunk (line-1,other)
                 and (line,other); returns Y positions.
   vert=false -> horizontal boundary at chunk-line y=line; returns X positions.
   Pure function of (seed, vert, line, other): both neighbours compute the
   identical list, so adjacent chunks always agree. */
function openingsFor(vert, line, other){
  var rng = rngFrom(hash32(worldSeed, vert ? 11 : 17, line, other));
  var count = 2 + (rng() * 3 | 0);            // 2-4 openings
  var arr = [], p;
  while (arr.length < count){
    p = 1 + (rng() * 14 | 0);                 // 1..14, corners excluded
    if (arr.indexOf(p) < 0) arr.push(p);
  }
  return arr;
}

/* --------------------------------------------------------- §4.3 chunk generation */
function repairConnectivity(cells, opens){
  var reached = new Uint8Array(256);
  var stack = [];
  function flood(){
    var fi, n;
    for (fi = 0; fi < 256; fi++) reached[fi] = 0;
    stack.length = 0;
    stack.push(opens[0]);
    reached[opens[0]] = 1;
    while (stack.length){
      n = stack.pop();
      var nx = n & 15, ny = n >> 4, d;
      for (d = 0; d < 4; d++){
        var ox = nx + (d === 0 ? 1 : d === 1 ? -1 : 0);
        var oy = ny + (d === 2 ? 1 : d === 3 ? -1 : 0);
        if (ox < 0 || ox > 15 || oy < 0 || oy > 15) continue;
        var q = (oy << 4) + ox;
        if (!reached[q] && cells[q] === 0){ reached[q] = 1; stack.push(q); }
      }
    }
  }
  flood();
  for (var i = 1; i < opens.length; i++){
    if (!reached[opens[i]]){
      // carve straight line from this opening to nearest reached cell
      var best = -1, bd = 1e9, bx2 = opens[i] & 15, by2 = opens[i] >> 4, k;
      for (k = 0; k < 256; k++){
        if (!reached[k]) continue;
        var dx = (k & 15) - bx2, dy = (k >> 4) - by2, d2 = dx * dx + dy * dy;
        if (d2 < bd){ bd = d2; best = k; }
      }
      if (best >= 0){
        var cx0 = bx2, cy0 = by2, cx1 = best & 15, cy1 = best >> 4;
        var sx2 = cx0, sy2 = cy0;
        var ddx = Math.abs(cx1 - cx0), ddy = -Math.abs(cy1 - cy0);
        var ex = ddx + ddy, step = cx0 < cx1 ? 1 : -1, sty = cy0 < cy1 ? 1 : -1;
        while (true){
          cells[(sy2 << 4) + sx2] = 0;
          if (sx2 === cx1 && sy2 === cy1) break;
          var e2 = 2 * ex, mx = 0, my = 0, oy2 = sy2;
          if (e2 >= ddy){ ex += ddy; sx2 += step; mx = 1; }
          if (e2 <= ddx){ ex += ddx; sy2 += sty; my = 1; }
          if (mx && my) cells[(oy2 << 4) + sx2] = 0; // bridge diagonal step: 4-connectivity
        }
      }
      flood(); // re-flood after carve
    }
  }
  // unreachable pockets -> wall (safe: unreachable anyway)
  for (i = 0; i < 256; i++) if (cells[i] === 0 && !reached[i]) cells[i] = 1;
}

function genChunk(cx, cy){
  DBG.gens++;
  var cells = new Uint8Array(256);
  var rng = rngFrom(hash32(worldSeed, cx, cy, 0x51AB3));
  var arch, r = rng();
  if (cx === 0 && cy === 0) arch = 0;                    // §4.3 spawn archetype
  else arch = r < 0.34 ? 0 : r < 0.62 ? 1 : r < 0.85 ? 2 : 3;
  var x, y, i, k;

  if (arch === 0){ // OPEN_OFFICE: sparse walls + pillar grid every ~5, 30% skip
    for (i = 0; i < 256; i++) cells[i] = 0;
    for (y = 2; y < 16; y += 5){
      for (x = 2; x < 16; x += 5){
        if (rng() < 0.3) continue;
        cells[(y << 4) + x] = 2;
        if (rng() < 0.5 && x + 1 < 16) cells[(y << 4) + x + 1] = 2;
      }
    }
    for (i = 0; i < 256; i++) if (cells[i] === 0 && rng() < 0.05) cells[i] = 1;
  }
  else if (arch === 1){ // MAZE: dense 2-thick wall segments -> corridors 2-3 wide
    for (i = 0; i < 256; i++) cells[i] = 0;
    var segs = 9 + (rng() * 7 | 0);
    for (i = 0; i < segs; i++){
      var horiz = rng() < 0.5;
      var sx = 1 + (rng() * 14 | 0), sy = 1 + (rng() * 14 | 0), len = 4 + (rng() * 9 | 0);
      for (k = 0; k < len; k++){
        var wx = horiz ? sx + k : sx, wy = horiz ? sy : sy + k;
        if (wx > 15 || wy > 15) break;
        cells[(wy << 4) + wx] = 1;
        var wx2 = wx + (horiz ? 0 : 1), wy2 = wy + (horiz ? 1 : 0);
        if (wx2 < 16 && wy2 < 16) cells[(wy2 << 4) + wx2] = 1;
      }
    }
  }
  else if (arch === 2){ // HALLS: long straight walls, irregular hallway grid
    for (i = 0; i < 256; i++) cells[i] = 0;
    var lines = [], nv = 2 + (rng() * 2 | 0), nh = 2 + (rng() * 2 | 0), li;
    for (li = 0; li < nv; li++) lines.push({ v: 1, p: 2 + (rng() * 12 | 0) });
    for (li = 0; li < nh; li++) lines.push({ v: 0, p: 2 + (rng() * 12 | 0) });
    for (li = 0; li < lines.length; li++){
      var ln = lines[li];
      for (i = 0; i < 16; i++){
        if (ln.v) cells[(i << 4) + ln.p] = 1; else cells[(ln.p << 4) + i] = 1;
      }
      var gaps = 3 + (rng() * 3 | 0), g;
      for (g = 0; g < gaps; g++){
        var gp = 1 + (rng() * 14 | 0);
        if (ln.v) cells[(gp << 4) + ln.p] = 0; else cells[(ln.p << 4) + gp] = 0;
      }
    }
  }
  else { // ATRIUM: mostly open, few large slabs
    for (i = 0; i < 256; i++) cells[i] = 0;
    var slabs = 1 + (rng() * 2 | 0);
    for (i = 0; i < slabs; i++){
      var sw = 3 + (rng() * 5 | 0), sh = 3 + (rng() * 5 | 0);
      var ox = 1 + (rng() * 11 | 0), oy = 1 + (rng() * 11 | 0);
      for (y = oy; y < oy + sh && y < 16; y++)
        for (x = ox; x < ox + sw && x < 16; x++) cells[(y << 4) + x] = 1;
    }
  }

  // border openings — pure edge function, both sides agree by construction
  var opens = [], pw, e;
  pw = openingsFor(true, cx, cy);         for (e = 0; e < pw.length; e++){ cells[pw[e] << 4] = 0; opens.push(pw[e] << 4); }
  pw = openingsFor(true, cx + 1, cy);     for (e = 0; e < pw.length; e++){ cells[(pw[e] << 4) + 15] = 0; opens.push((pw[e] << 4) + 15); }
  pw = openingsFor(false, cy, cx);        for (e = 0; e < pw.length; e++){ cells[pw[e]] = 0; opens.push(pw[e]); }
  pw = openingsFor(false, cy + 1, cx);    for (e = 0; e < pw.length; e++){ cells[(15 << 4) + pw[e]] = 0; opens.push((15 << 4) + pw[e]); }

  DBG.preRepair = { cells: cells.slice(), opens: opens.slice(), cx: cx, cy: cy };
  repairConnectivity(cells, opens);

  // §4.4 per-4x4-block lighting: lit 80% / dim 15% / dark 5%
  var light = new Uint8Array(16);
  for (y = 0; y < 4; y++) for (x = 0; x < 4; x++){
    var lr = hash32(worldSeed, cx * 4 + x, cy * 4 + y, 0x1F2E3C) % 100;
    light[y * 4 + x] = lr < 80 ? 2 : (lr < 95 ? 1 : 0);
  }
  return { cells: cells, light: light, cx: cx, cy: cy };
}

/* §4.1 bounded chunk set: generate radius 3, prune beyond radius 4 */
function pruneChunks(){
  var pcx = Math.floor(P.x / 16), pcy = Math.floor(P.y / 16);
  var key, pos, cx, cy, drop = false;
  var it = chunks.keys();
  var doomed = [];
  while (!(pos = it.next()).done){
    key = pos.value;
    var c = key.split(',');
    cx = +c[0]; cy = +c[1];
    if (Math.max(Math.abs(cx - pcx), Math.abs(cy - pcy)) > TUNE.PRUNE_R) doomed.push(key);
  }
  for (key = 0; key < doomed.length; key++) chunks.delete(doomed[key]);
  if (doomed.length) invalidateChunkCache();
  // hard cap: trim down to the radius-3 set (49 chunks) — regen is deterministic + sub-ms
  if (chunks.size > TUNE.MAX_CHUNKS){
    var it2 = chunks.keys(), trim = [];
    while (!(pos = it2.next()).done){
      var c2 = pos.value.split(',');
      if (Math.max(Math.abs(+c2[0] - pcx), Math.abs(+c2[1] - pcy)) > TUNE.GEN_R) trim.push(pos.value);
    }
    for (key = 0; key < trim.length && chunks.size > TUNE.MAX_CHUNKS; key++) chunks.delete(trim[key]);
    invalidateChunkCache();
  }
  return chunks.size;
}

/* ============================================================= §5 textures
   All 64x64, Uint32Array[4096], little-endian ABGR (0xAABBGGRR). */
var TEX = {};
function vhash(ix, iy, s){ return hash32(ix, iy, s, 0xA653) / 4294967295; }
function vnoise(x, y, s){
  var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  var u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  var a = vhash(ix, iy, s), b = vhash(ix + 1, iy, s);
  var c = vhash(ix, iy + 1, s), d = vhash(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function pxPix(r, g, b){ return (0xff000000 | (b << 16) | (g << 8) | r) >>> 0; }
function clamp255(v){ return v < 0 ? 0 : v > 255 ? 255 : v | 0; }

function genTextures(){
  var S = 64 * 64, i, x, y, t, rng;
  // §5 wallpaper: yellow base, faint vertical stripes, mottling, bottom stains
  var wall = new Uint32Array(S);
  rng = rngFrom(hash32(worldSeed, 0, 0, 0x7E11));
  var stains = [];
  for (i = 0; i < 6; i++) stains.push({ x: rng() * 64, y: 40 + rng() * 24, r: 4 + rng() * 6 });
  for (y = 0; y < 64; y++) for (x = 0; x < 64; x++){
    var n = vnoise(x * 0.13, y * 0.13, 11) * 0.6 + vnoise(x * 0.42, y * 0.42, 12) * 0.4;
    var m = 1;
    if (x % 8 === 0) m *= 0.92;                       // faint stripe every 8 px
    for (t = 0; t < 6; t++){
      var st = stains[t], dx = x - st.x, dy = y - st.y, d2 = dx * dx + dy * dy;
      if (d2 < st.r * st.r) m *= 0.62 + 0.38 * Math.sqrt(d2 / (st.r * st.r));
    }
    var rr = (201 + n * 22) * m, gg = (180 + n * 20) * m, bb = (88 + n * 20) * m;
    wall[y * 64 + x] = pxPix(clamp255(rr), clamp255(gg), clamp255(bb));
  }
  TEX.wall = wall;
  // §5 carpet: brown-yellow, per-pixel mottling, darker damp patches
  var carpet = new Uint32Array(S);
  rng = rngFrom(hash32(worldSeed, 0, 0, 0x7E12));
  var damp = [];
  for (i = 0; i < 4; i++) damp.push({ x: rng() * 64, y: rng() * 64, r: 6 + rng() * 10 });
  for (y = 0; y < 64; y++) for (x = 0; x < 64; x++){
    var n2 = 0.82 + vhash(x, y, 21) * 0.30;
    var m2 = 1;
    for (t = 0; t < 4; t++){
      var dp = damp[t], dx2 = x - dp.x, dy2 = y - dp.y, d22 = dx2 * dx2 + dy2 * dy2;
      if (d22 < dp.r * dp.r) m2 *= 0.60 + 0.40 * Math.sqrt(d22 / (dp.r * dp.r));
    }
    carpet[y * 64 + x] = pxPix(clamp255(122 * n2 * m2), clamp255(109 * n2 * m2), clamp255(63 * n2 * m2));
  }
  TEX.carpet = carpet;
  // §5 ceiling tile: off-white, seams every 32 px, grime
  var ceil = new Uint32Array(S);
  for (y = 0; y < 64; y++) for (x = 0; x < 64; x++){
    var gr = 0.86 + vnoise(x * 0.2, y * 0.2, 31) * 0.14;
    var seam = (x % 32 === 0) || (y % 32 === 0);
    var r3 = seam ? 148 : 214 * gr, g3 = seam ? 146 : 210 * gr, b3 = seam ? 140 : 198 * gr;
    ceil[y * 64 + x] = pxPix(clamp255(r3), clamp255(g3), clamp255(b3));
  }
  TEX.ceil = ceil;
  // §5 light panel: bright warm white, subtle gradient, dark frame
  var panel = new Uint32Array(S);
  for (y = 0; y < 64; y++) for (x = 0; x < 64; x++){
    if (x < 5 || x > 58 || y < 5 || y > 58){ panel[y * 64 + x] = pxPix(92, 90, 86); continue; }
    var dx3 = Math.max(Math.abs(x - 32) / 27, Math.abs(y - 32) / 27);
    var gf = 1 - 0.22 * dx3;
    panel[y * 64 + x] = pxPix(clamp255(255 * gf), clamp255(244 * gf), clamp255(218 * gf));
  }
  TEX.panel = panel;
}

/* ---------------------------------------- §5/§6 sprite art via offscreen canvas */
function texFromCanvas(c){
  var d = c.getContext('2d').getImageData(0, 0, c.width, c.height);
  return { w: c.width, h: c.height, data: new Uint32Array(d.data.buffer) };
}
function drawFigure(g, col, dx, sway){
  g.fillStyle = col;
  g.save(); g.translate(dx, 0);
  g.save(); g.translate(-3, -22); g.rotate(-sway); g.fillRect(-2, 0, 4, 22); g.restore(); // L leg
  g.save(); g.translate(3, -22); g.rotate(sway);  g.fillRect(-2, 0, 4, 22); g.restore(); // R leg
  g.fillRect(-6, -52, 12, 32);                                                            // torso
  g.beginPath(); g.arc(0, -57, 6, 0, Math.PI * 2); g.fill();                              // head
  g.save(); g.translate(-6, -50); g.rotate(0.15 + sway); g.fillRect(-2, 0, 4, 30); g.restore(); // L arm
  g.save(); g.translate(6, -50); g.rotate(-0.15 - sway); g.fillRect(-2, 0, 4, 30); g.restore(); // R arm
  g.restore();
}
function genSprites(){
  var f, c, g;
  // §5 The Wanderer: 3-frame tall dark silhouette, rim highlight, subtle sway
  TEX.mon = [];
  for (f = 0; f < 3; f++){
    c = document.createElement('canvas'); c.width = 64; c.height = 64;
    g = c.getContext('2d');
    var sway = (f - 1) * 0.09;
    drawFigure(g, '#48485c', 1.2, sway);  // rim highlight (right edge)
    drawFigure(g, '#131118', 0, sway);    // dark body on top
    TEX.mon.push(texFromCanvas(c));
  }
  // §6 first-person body: arms + flashlight, bottom-center overlay
  c = document.createElement('canvas'); c.width = 150; c.height = 92;
  g = c.getContext('2d');
  g.lineCap = 'round';
  g.strokeStyle = '#2a2420'; g.lineWidth = 15;                       // sleeves
  g.beginPath(); g.moveTo(-68 + 75, 34 + 58); g.quadraticCurveTo(-50 + 75, 5 + 58, -14 + 75, -6 + 58); g.stroke();
  g.beginPath(); g.moveTo(68 + 75, 34 + 58); g.quadraticCurveTo(50 + 75, 5 + 75, 14 + 75, -8 + 58); g.stroke();
  g.fillStyle = '#57493e';                                            // gloves
  g.beginPath(); g.ellipse(-14 + 75, -6 + 58, 7, 9, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(14 + 75, -8 + 58, 7, 9, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#3f4147'; g.fillRect(10 + 75, -36 + 58, 12, 32);     // flashlight body
  g.fillStyle = '#6a6d75'; g.fillRect(10 + 75, -36 + 58, 12, 6);      // bezel highlight
  g.fillStyle = '#e8e2c2'; g.fillRect(12 + 75, -39 + 58, 8, 4);       // lens
  TEX.arms = texFromCanvas(c);
}

/* ---------------------------------------------- §3.5 post-processing overlays */
function genVignette(){
  var c = document.createElement('canvas'); c.width = R.W; c.height = R.H;
  var g = c.getContext('2d');
  var grad = g.createRadialGradient(R.W / 2, R.H / 2, R.H * 0.35, R.W / 2, R.H / 2, R.W * 0.72);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.5)');
  g.fillStyle = grad; g.fillRect(0, 0, R.W, R.H);
  g.fillStyle = 'rgba(0,0,0,0.05)';                                   // subtle scanlines
  for (var y = 0; y < R.H; y += 2) g.fillRect(0, y, R.W, 1);
  R.vig = c;
}
/* §6 flashlight: precomputed brightness boost for center columns */
function genBoost(){
  var b = new Int32Array(R.W), x;
  for (x = 0; x < R.W; x++){
    var t = Math.abs(x - R.W / 2) / (R.W * 0.22);
    b[x] = 256 + (t < 1 ? 70 * (1 - t) : 0) | 0;
  }
  R.boost = b;
}

/* ======================================================== §3 software renderer
   R: reusable ImageData + Uint32Array pixel buffer, z-buffer, per-tier state */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var R = { W: 320, H: 180, drawDist: 24, floorOn: true, tier: 0,
          buf: null, pix: null, zbuf: null, vig: null, boost: null,
          armsW: 150, armsH: 92, flatFloor: null, flatCeil: null };

function setTier(n){
  G.tier = n;
  var t = TIERS[n];
  R.W = t[0]; R.H = t[1]; R.drawDist = t[2]; R.floorOn = t[3];
  cv.width = R.W; cv.height = R.H;
  R.buf = ctx.createImageData(R.W, R.H);
  R.pix = new Uint32Array(R.buf.data.buffer);
  R.zbuf = new Float32Array(R.W);
  genVignette();
  genBoost();
  R.armsW = (R.W * 0.47) | 0;
  R.armsH = (R.armsW * 92 / 150) | 0;
  if (!R.floorOn) buildFlatLUTs();
  fitCanvas();
}
function fitCanvas(){
  var s = Math.min(window.innerWidth / R.W, window.innerHeight / R.H);
  cv.style.width = (R.W * s) + 'px';
  cv.style.height = (R.H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);

/* §3.2 fog: linear fade to black, fully dark at draw-distance edge.
   Returns fixed-point 0..256. */
function fogFixed(d){
  var f = 1 - d / R.drawDist;
  if (f <= 0) return 0;
  if (f > 1) f = 1;
  return (f * 256) | 0;
}

/* §9 tier 3: flat fog gradient rows instead of floor casting */
function buildFlatLUTs(){
  R.flatFloor = new Int32Array(R.H + 16);
  R.flatCeil = new Int32Array(R.H + 16);
  var i, d, f, c, r, g, b;
  var fr = 0, fg = 0, fb = 0, n = 4096;              // average carpet texel
  for (i = 0; i < n; i++){ fr += TEX.carpet[i] & 255; fg += (TEX.carpet[i] >> 8) & 255; fb += (TEX.carpet[i] >> 16) & 255; }
  var cr = fr / n | 0, cg = fg / n | 0, cb = fb / n | 0;
  fr = 0; fg = 0; fb = 0;                            // average ceiling texel
  for (i = 0; i < n; i++){ fr += TEX.ceil[i] & 255; fg += (TEX.ceil[i] >> 8) & 255; fb += (TEX.ceil[i] >> 16) & 255; }
  var er = fr / n | 0, eg = fg / n | 0, eb = fb / n | 0;
  for (d = 1; d < R.H + 16; d++){
    f = fogFixed((0.5 * R.H) / d) * 200 >> 8;        // 200/256 avg block light
    R.flatFloor[d] = pxPix(clamp255(cr * f >> 8), clamp255(cg * f >> 8), clamp255(cb * f >> 8));
    f = fogFixed((0.5 * R.H) / d) * 200 >> 8;
    R.flatCeil[d] = pxPix(clamp255(er * f >> 8), clamp255(eg * f >> 8), clamp255(eb * f >> 8));
  }
}

/* -------------------------------------------------- §3.2 walls: DDA per column */
function renderWalls(posX, posY, dirX, dirY, planeX, planeY, eyeH, horizon, flickI){
  var W = R.W, H = R.H, pix = R.pix, zbuf = R.zbuf, boost = R.boost;
  var tex = TEX.wall, wallTex = tex;
  for (var x = 0; x < W; x++){
    var cameraX = 2 * x / W - 1;
    var rdx = dirX + planeX * cameraX, rdy = dirY + planeY * cameraX;
    var mapX = Math.floor(posX), mapY = Math.floor(posY);
    var deltaDistX = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
    var deltaDistY = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
    var stepX, stepY, sideDistX, sideDistY, side;
    if (rdx < 0){ stepX = -1; sideDistX = (posX - mapX) * deltaDistX; }
    else       { stepX = 1;  sideDistX = (mapX + 1 - posX) * deltaDistX; }
    if (rdy < 0){ stepY = -1; sideDistY = (posY - mapY) * deltaDistY; }
    else       { stepY = 1;  sideDistY = (mapY + 1 - posY) * deltaDistY; }
    var hit = 0, cell = 0, iter = 0, cap = R.drawDist * 2 + 8, perp = R.drawDist;
    while (!hit){
      if (sideDistX < sideDistY){ sideDistX += deltaDistX; mapX += stepX; side = 0; }
      else                      { sideDistY += deltaDistY; mapY += stepY; side = 1; }
      cell = cellAt(mapX, mapY);
      perp = side === 0 ? sideDistX - deltaDistX : sideDistY - deltaDistY;
      if (cell) hit = 1;
      else if (++iter > cap || perp > R.drawDist){ hit = 2; }
    }
    zbuf[x] = perp < R.drawDist ? perp : R.drawDist;
    if (hit !== 1 || perp >= R.drawDist) continue;              // fogged to black
    var lineH = H / perp;
    var drawS = horizon - (1 - eyeH) * lineH;
    var drawE = horizon + eyeH * lineH;
    var wallX = side === 0 ? posY + perp * rdy : posX + perp * rdx;
    wallX -= Math.floor(wallX);
    var texX = (wallX * 64) | 0;
    if (side === 0 && rdx > 0) texX = 63 - texX;
    if (side === 1 && rdy < 0) texX = 63 - texX;
    // shade = side * fog * block light * flicker * flashlight (§3.2/§6)
    var s = (fogFixed(perp) * flickI) >> 8;
    s = (s * lightMul(mapX, mapY)) >> 8;
    s = (s * (side === 0 ? 205 : 256)) >> 8;
    s = (s * boost[x]) >> 8;
    if (cell === 2) s = (s * 215) >> 8;                          // pillars slightly colder
    var yA = drawS < 0 ? 0 : drawS | 0;
    var yB = drawE > H ? H : drawE | 0;
    var tstep = 64 / lineH;
    var tpos = (yA - drawS) * tstep;
    var o = yA * W + x;
    for (var y = yA; y < yB; y++){
      var ty = tpos | 0;
      if (ty < 0) ty = 0; else if (ty > 63) ty = 63;
      var c = wallTex[(ty << 6) + texX];
      var rw = ((c & 255) * s) >> 8; if (rw > 255) rw = 255;
      var gw = (((c >>> 8) & 255) * s) >> 8; if (gw > 255) gw = 255;
      var bw = (((c >>> 16) & 255) * s) >> 8; if (bw > 255) bw = 255;
      pix[o] = (0xff000000 | (bw << 16) | (gw << 8) | rw);
      tpos += tstep; o += W;
    }
  }
}

/* ----------------------------- §3.3 floor & ceiling casting (per screen row)
   Fixed-point accumulation: world pos kept in 1/64-texel units as a double,
   biased into int32 range once per pixel — no Math.floor in the inner loop. */
var F64OFF = 1 << 20;                                    /* multiple of 64, exact in doubles */
function renderFloorCeil(posX, posY, dirX, dirY, planeX, planeY, eyeH, horizon, flickI){
  var W = R.W, H = R.H, pix = R.pix, boost = R.boost;
  var rlx = dirX - planeX, rly = dirY - planeY;
  var rrx = dirX + planeX, rry = dirY + planeY;
  var carpet = TEX.carpet, ceil = TEX.ceil, panel = TEX.panel;
  var foff = F64OFF;                                                   /* local: no vm-global reads in the hot loop */
  var y, x, o, rowDist, fogI, boostRow, stepX, stepY, fx, fy, s, c, tx, ty;
  var lBKX = -1, lBKY = -1, lLV = 0, gx, gy, fxI, fyI, ck;
  // ---- floor (below horizon): rowDist = eyeH*H/(y-horizon)
  for (y = horizon + 1; y < H; y++){
    rowDist = (eyeH * H) / (y - horizon);
    fogI = fogFixed(rowDist);
    boostRow = (fogI * flickI) >> 8;
    stepX = rowDist * (rrx - rlx) / W * 64;
    stepY = rowDist * (rry - rly) / W * 64;
    fx = (posX + rowDist * rlx) * 64;
    fy = (posY + rowDist * rly) * 64;
    o = y * W;
    for (x = 0; x < W; x++){
      fxI = ((fx + foff) | 0) - foff;                          // = floor(fx*64)
      fyI = ((fy + foff) | 0) - foff;
      gx = fxI >> 6; gy = fyI >> 6;                                // = floor(world)
      ck = (gx >> 2) - lBKX | 0;
      if (ck){ lBKX = gx >> 2; lBKY = gy >> 2; lLV = lightMulB(lBKX, lBKY); }
      else { ck = (gy >> 2) - lBKY; if (ck){ lBKY = gy >> 2; lLV = lightMulB(lBKX, lBKY); } }
      tx = fxI & 63; ty = fyI & 63;
      s = (boostRow * lLV) >> 8;
      s = (s * boost[x]) >> 8;
      c = carpet[(ty << 6) + tx];
      var rr = ((c & 255) * s) >> 8; if (rr > 255) rr = 255;
      var gg = (((c >>> 8) & 255) * s) >> 8; if (gg > 255) gg = 255;
      var bb = (((c >>> 16) & 255) * s) >> 8; if (bb > 255) bb = 255;
      pix[o + x] = (0xff000000 | (bb << 16) | (gg << 8) | rr);
      fx += stepX; fy += stepY;
    }
  }
  // ---- ceiling (above horizon): rowDist = (1-eyeH)*H/(horizon-y)
  for (y = horizon - 1; y >= 0; y--){
    rowDist = ((1 - eyeH) * H) / (horizon - y);
    fogI = fogFixed(rowDist);
    boostRow = (fogI * flickI) >> 8;
    stepX = rowDist * (rrx - rlx) / W * 64;
    stepY = rowDist * (rry - rly) / W * 64;
    fx = (posX + rowDist * rlx) * 64;
    fy = (posY + rowDist * rly) * 64;
    o = y * W;
    lBKX = -1; lBKY = -1;
    for (x = 0; x < W; x++){
      fxI = ((fx + foff) | 0) - foff;
      fyI = ((fy + foff) | 0) - foff;
      gx = fxI >> 6; gy = fyI >> 6;
      ck = (gx >> 2) - lBKX | 0;
      if (ck){ lBKX = gx >> 2; lBKY = gy >> 2; lLV = lightMulB(lBKX, lBKY); }
      else { ck = (gy >> 2) - lBKY; if (ck){ lBKY = gy >> 2; lLV = lightMulB(lBKX, lBKY); } }
      tx = fxI & 63; ty = fyI & 63;
      s = (boostRow * lLV) >> 8;
      s = (s * boost[x]) >> 8;
      // lit block -> light panel texture; dark blocks are dim/black areas
      c = (lLV === 256 ? panel : ceil)[(ty << 6) + tx];
      var rr2 = ((c & 255) * s) >> 8; if (rr2 > 255) rr2 = 255;
      var gg2 = (((c >>> 8) & 255) * s) >> 8; if (gg2 > 255) gg2 = 255;
      var bb2 = (((c >>> 16) & 255) * s) >> 8; if (bb2 > 255) bb2 = 255;
      pix[o + x] = (0xff000000 | (bb2 << 16) | (gg2 << 8) | rr2);
      fx += stepX; fy += stepY;
    }
  }
}
function renderFlatRows(horizon){
  var W = R.W, H = R.H, pix = R.pix, ff = R.flatFloor, fc = R.flatCeil, x, y, c, o;
  for (y = 0; y < H; y++){
    o = y * W;
    if (y > horizon){ c = ff[y - horizon > 15 ? 15 : y - horizon]; }
    else if (y < horizon){ c = fc[horizon - y > 15 ? 15 : horizon - y]; }
    else { c = 0xff000000; }
    for (x = 0; x < W; x++) pix[o + x] = c;
  }
}

/* ------------------------------------------------------ §3.4 billboard sprites */
function renderMonster(dirX, dirY, planeX, planeY, eyeH, horizon, flickI){
  if (!M.active) return;
  var dx = M.x - P.x, dy = M.y - P.y;
  var invDet = 1 / (planeX * dirY - dirX * planeY);
  var tX = invDet * (dirY * dx - dirX * dy);
  var tY = invDet * (-planeY * dx + planeX * dy);
  if (tY <= 0.05 || tY >= R.drawDist) return;                    // behind / fogged
  var W = R.W, H = R.H, pix = R.pix, zbuf = R.zbuf, boost = R.boost;
  var sx = (W / 2) * (1 + tX / tY);
  var hpx = (TUNE.M_HEIGHT * H) / tY;
  var wpx = hpx * (TUNE.M_WIDTH / TUNE.M_HEIGHT);
  var spr = TEX.mon[M.frame];
  var x0 = Math.ceil(sx - wpx / 2), x1 = Math.floor(sx + wpx / 2);
  if (x1 < 0 || x0 >= W || wpx < 1) return;
  var yTop = horizon + (eyeH - TUNE.M_HEIGHT) * (H / tY);
  var yBot = horizon + eyeH * (H / tY);
  var yA = yTop < 0 ? 0 : yTop | 0;
  var yB = yBot > H ? H : yBot | 0;
  var baseS = (fogFixed(tY) * flickI) >> 8;
  baseS = (baseS * lightMul(M.x | 0, M.y | 0)) >> 8;
  var data = spr.data, tw = spr.w, th = spr.h;
  var x, y, c, s, a;
  for (x = x0 > 0 ? x0 : 0; x <= (x1 < W - 1 ? x1 : W - 1); x++){
    if (tY >= zbuf[x]) continue;                                  // occluded by wall
    var texX = ((x - (sx - wpx / 2)) / wpx * tw) | 0;
    if (texX < 0) texX = 0; else if (texX >= tw) texX = tw - 1;
    s = (baseS * boost[x]) >> 8;
    for (y = yA; y < yB; y++){
      var texY = ((y - yTop) / hpx * th) | 0;
      if (texY < 0) texY = 0; else if (texY >= th) texY = th - 1;
      c = data[texY * tw + texX];
      a = c >>> 24;
      if (a < 128) continue;
      var rm = ((c & 255) * s) >> 8; if (rm > 255) rm = 255;
      var gm = (((c >>> 8) & 255) * s) >> 8; if (gm > 255) gm = 255;
      var bm = (((c >>> 16) & 255) * s) >> 8; if (bm > 255) bm = 255;
      pix[y * W + x] = (0xff000000 | (bm << 16) | (gm << 8) | rm);
    }
  }
}

/* --------------------------------------- §6 first-person body overlay (no depth) */
function renderArms(){
  var spr = TEX.arms, OW = R.armsW, OH = R.armsH, W = R.W, H = R.H, pix = R.pix;
  var ox = ((W - OW) >> 1) + (P.swayPx | 0);
  var oy = H - OH + (P.bobArm | 0);
  var stepS = spr.w / OW, stepT = spr.h / OH;
  var sF = (G.flicker * 256 * 0.55 + 256 * 0.45) | 0;            // arms dim in blackouts
  var x, y, c, s;
  for (y = 0; y < OH; y++){
    var dy = oy + y;
    if (dy < 0 || dy >= H) continue;
    var st = y * stepT | 0;
    for (x = 0; x < OW; x++){
      var dxp = ox + x;
      if (dxp < 0 || dxp >= W) continue;
      c = spr.data[st * spr.w + (x * stepS | 0)];
      if ((c >>> 24) < 128) continue;
      s = sF;
      pix[dy * W + dxp] = (0xff000000 |
                          ((((c >>> 16) & 255) * s >> 8) << 16) |
                          ((((c >>> 8) & 255) * s >> 8) << 8) |
                          (((c & 255) * s) >> 8));
    }
  }
}

/* --------------------------------------------------------- frame composition */
function renderFrame(){
  var dirX = Math.cos(P.a), dirY = Math.sin(P.a);
  var planeX = -dirY * TUNE.FOV_PLANE, planeY = dirX * TUNE.FOV_PLANE;
  var eyeH = 0.5 + P.bobEye;
  var horizon = (R.H >> 1) + P.pitchPx;
  var flickI = (G.flicker * 256) | 0;
  var posX = P.x, posY = P.y;
  if (R.floorOn) renderFloorCeil(posX, posY, dirX, dirY, planeX, planeY, eyeH, horizon, flickI);
  else renderFlatRows(horizon);
  renderWalls(posX, posY, dirX, dirY, planeX, planeY, eyeH, horizon, flickI);
  renderMonster(dirX, dirY, planeX, planeY, eyeH, horizon, flickI);
  renderArms();
  ctx.putImageData(R.buf, 0, 0);                                 // single putImageData
  ctx.drawImage(R.vig, 0, 0);                                    // §3.5 vignette+scanlines
}

/* ===================================================== §6 player & collision */
var P = { x: 0.5, y: 0.5, a: 0, prevA: 0, bobPhase: 0, bobEye: 0, pitchPx: 0,
          bobArm: 0, swayPx: 0, stamina: 1, sprinting: false, odom: 0 };
var keys = {};

/* circle-vs-grid, axis-separated -> smooth wall sliding (§6) */
function resolveCells(o, r, moved, axisX){
  var x0 = Math.floor(o.x - r), x1 = Math.floor(o.x + r);
  var y0 = Math.floor(o.y - r), y1 = Math.floor(o.y + r);
  var cx, cy;
  for (cy = y0; cy <= y1; cy++){
    for (cx = x0; cx <= x1; cx++){
      if (!isSolid(cx, cy)) continue;
      var nx = Math.max(cx, Math.min(o.x, cx + 1));
      var ny = Math.max(cy, Math.min(o.y, cy + 1));
      var ddx = o.x - nx, ddy = o.y - ny;
      var d2 = ddx * ddx + ddy * ddy;
      if (d2 < r * r){
        if (d2 > 1e-9){
          var d = Math.sqrt(d2);
          o.x += ddx / d * (r - d);
          o.y += ddy / d * (r - d);
        } else if (axisX){                    // center inside a wall: eject on moved axis
          o.x = moved > 0 ? cx - r : cx + 1 + r;
        } else {
          o.y = moved > 0 ? cy - r : cy + 1 + r;
        }
      }
    }
  }
}
function moveCollide(o, dx, dy, r){
  o.x += dx; resolveCells(o, r, dx, true);
  o.y += dy; resolveCells(o, r, dy, false);
}

function playerUpdate(dt){
  if (G.catchT > 0) return;
  var fwd = 0, str = 0, rot = 0;
  if (keys.KeyW || keys.ArrowUp) fwd += 1;
  if (keys.KeyS || keys.ArrowDown) fwd -= 1;
  if (keys.KeyA) str -= 1;
  if (keys.KeyD) str += 1;
  if (keys.ArrowLeft) rot -= 1;
  if (keys.ArrowRight) rot += 1;
  P.a += rot * TUNE.ROT_SPEED * dt;
  var dirX = Math.cos(P.a), dirY = Math.sin(P.a);
  var mvx = dirX * fwd - dirY * str;
  var mvy = dirY * fwd + dirX * str;
  var len = Math.sqrt(mvx * mvx + mvy * mvy);
  var ox = P.x, oy = P.y;
  if (len > 0.001){
    mvx /= len; mvy /= len;
    var wantSprint = (keys.ShiftLeft || keys.ShiftRight) && fwd > 0;
    var canSprint = P.sprinting ? P.stamina > 0 : P.stamina > TUNE.STAM_MIN;
    P.sprinting = wantSprint && canSprint;
    if (P.sprinting) P.stamina -= dt / TUNE.STAM_DRAIN;
    else P.stamina += dt / TUNE.STAM_REGEN;
    if (P.stamina > 1) P.stamina = 1;
    if (P.stamina < 0) P.stamina = 0;
    var spd = P.sprinting ? TUNE.SPRINT : TUNE.WALK;
    moveCollide(P, mvx * spd * dt, mvy * spd * dt, TUNE.P_RAD);
  } else {
    P.sprinting = false;
    P.stamina += dt / TUNE.STAM_REGEN;
    if (P.stamina > 1) P.stamina = 1;
  }
  var moved = Math.sqrt((P.x - ox) * (P.x - ox) + (P.y - oy) * (P.y - oy));
  P.odom += moved;
  // head bob drives footsteps (§6)
  if (moved > 0.0005){
    var oldPh = P.bobPhase;
    P.bobPhase += moved * 2.4;
    P.bobEye = Math.sin(P.bobPhase) * TUNE.BOB_AMP;
    P.pitchPx = (Math.sin(P.bobPhase * 2) * TUNE.BOB_PITCH) | 0;
    P.bobArm = (Math.abs(Math.sin(P.bobPhase)) * 5) | 0;
    if (((oldPh / Math.PI) | 0) !== ((P.bobPhase / Math.PI) | 0)) AU.step(P.sprinting);
  } else {
    P.bobEye *= 0.8; P.pitchPx = P.pitchPx * 0.8 | 0; P.bobArm *= 0.8;
  }
  // view sway on turn (§6)
  var tr = dt > 0 ? (P.a - P.prevA) / dt : 0;
  P.prevA = P.a;
  var target = tr * -6;
  if (target > 14) target = 14; else if (target < -14) target = -14;
  P.swayPx += (target - P.swayPx) * Math.min(1, dt * 10);
}

/* ------------------------------------------------- §7 LOS: DDA ray on the grid */
function los(ax, ay, bx, by){
  var dx = bx - ax, dy = by - ay;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 0.001) return true;
  var rdx = dx / dist, rdy = dy / dist;
  var mapX = Math.floor(ax), mapY = Math.floor(ay);
  var tX = Math.floor(bx), tY = Math.floor(by);
  var deltaX = rdx === 0 ? 1e30 : Math.abs(1 / rdx);
  var deltaY = rdy === 0 ? 1e30 : Math.abs(1 / rdy);
  var stepX, stepY, sdX, sdY, guard = 0;
  if (rdx < 0){ stepX = -1; sdX = (ax - mapX) * deltaX; }
  else        { stepX = 1;  sdX = (mapX + 1 - ax) * deltaX; }
  if (rdy < 0){ stepY = -1; sdY = (ay - mapY) * deltaY; }
  else        { stepY = 1;  sdY = (mapY + 1 - ay) * deltaY; }
  while (guard++ < 160){
    if (mapX === tX && mapY === tY) return true;
    if (sdX < sdY){ sdX += deltaX; mapX += stepX; }
    else          { sdY += deltaY; mapY += stepY; }
    if (cellAt(mapX, mapY) !== 0) return false;
  }
  return true;
}

/* ------- §7 A*: 21x21 window, <=256 expansions, preallocated + Int32 heap */
var AW = TUNE.ASTAR_WIN, AW2 = AW * AW;
var asG = new Int32Array(AW2), asF = new Int32Array(AW2), asFrom = new Int32Array(AW2);
var asOpen = new Int32Array(AW2), asClosed = new Int32Array(AW2);
var heap = new Int32Array(AW2 + 2), heapN = 0, asGen = 0;
var asPX = new Int32Array(AW2), asPY = new Int32Array(AW2), asPathLen = 0;
var asBestI = 0, asBestH = 0;

function heapPush(n){
  var i = ++heapN, v;
  heap[i] = n;
  while (i > 1){
    var p = i >> 1;
    if (asF[heap[p]] <= asF[heap[i]]) break;
    v = heap[p]; heap[p] = heap[i]; heap[i] = v;
    i = p;
  }
}
function heapPop(){
  var top = heap[1], v;
  heap[1] = heap[heapN]; heapN--;
  var i = 1;
  while (true){
    var l = i << 1, r = l + 1, m = i;
    if (l <= heapN && asF[heap[l]] < asF[heap[m]]) m = l;
    if (r <= heapN && asF[heap[r]] < asF[heap[m]]) m = r;
    if (m === i) break;
    v = heap[m]; heap[m] = heap[i]; heap[i] = v;
    i = m;
  }
  return top;
}
/* A* from monster cell to (tgx,tgy); target must lie inside the window.
   Returns path length; fills asPX/asPY with global cell coords. */
function astar(sgx, sgy, tgx, tgy){
  DBG.astarCalls++;
  var wx = sgx - (AW >> 1), wy = sgy - (AW >> 1);
  var si = (sgy - wy) * AW + (sgx - wx);
  var ti = (tgy - wy) * AW + (tgx - wx);
  asGen++;
  heapN = 0;
  var nodes = 0, found = false;
  asG[si] = 0; asFrom[si] = -1; asOpen[si] = asGen; asClosed[si] = 0;
  asF[si] = Math.abs(tgx - sgx) + Math.abs(tgy - sgy);
  asBestI = si; asBestH = asF[si];
  heapPush(si);
  while (heapN > 0){
    if (nodes >= TUNE.ASTAR_CAP){ DBG.astarOverflows++; break; }   // budget: best-so-far
    var n = heapPop();
    if (asClosed[n] === asGen) continue;
    asClosed[n] = asGen;
    nodes++;
    var nx = n % AW, ny = (n - nx) / AW;
    var gx = wx + nx, gy = wy + ny;
    var h = Math.abs(tgx - gx) + Math.abs(tgy - gy);
    if (h < asBestH){ asBestH = h; asBestI = n; }
    if (n === ti){ found = true; break; }
    var d, nb, ox, oy;
    for (d = 0; d < 4; d++){
      ox = nx + (d === 0 ? 1 : d === 1 ? -1 : 0);
      oy = ny + (d === 2 ? 1 : d === 3 ? -1 : 0);
      if (ox < 0 || ox >= AW || oy < 0 || oy >= AW) continue;
      nb = oy * AW + ox;
      if (asClosed[nb] === asGen) continue;
      if (cellAt(wx + ox, wy + oy) !== 0) continue;
      var ng = asG[n] + 1;
      if (asOpen[nb] !== asGen || ng < asG[nb]){
        asG[nb] = ng;
        asF[nb] = ng + Math.abs(tgx - (wx + ox)) + Math.abs(tgy - (wy + oy));
        asFrom[nb] = n;
        asOpen[nb] = asGen;
        heapPush(nb);
      }
    }
  }
  DBG.astarMaxNodes = nodes > DBG.astarMaxNodes ? nodes : DBG.astarMaxNodes;
  var end = found ? ti : asBestI;
  var len = 0, cur = end;
  while (cur >= 0 && len < AW2){
    var lx = cur % AW, ly = (cur - lx) / AW;
    asPX[len] = wx + lx; asPY[len] = wy + ly;
    len++;
    if (cur === si) break;
    cur = asFrom[cur];
  }
  var a3 = 0, b3 = len - 1, tmp;
  while (a3 < b3){ tmp = asPX[a3]; asPX[a3] = asPX[b3]; asPX[b3] = tmp;
                   tmp = asPY[a3]; asPY[a3] = asPY[b3]; asPY[b3] = tmp; a3++; b3--; }
  asPathLen = len;
  return len;
}

/* ------------------------------------------------------------ §7 The Wanderer */
var M = { active: false, neverSpawned: true, respawnT: 0, state: 'ROAM',
          x: 0, y: 0, frame: 0, animT: 0, pathPos: 0, pathLen: 0, useGreedy: false,
          repathT: 0, lostT: 0, searchT: 0, searchPhase: 0, sweeps: 0, waitT: 0,
          stuckT: 0, lastX: 0, lastY: 0, detourT: 0, detourSign: 1,
          lastKX: 0, lastKY: 0, targetCX: 0, targetCY: 0, despawnT: 0 };

function pathTo(tgx, tgy){
  M.useGreedy = false;
  M.arrived = false;
  var mgx = Math.floor(M.x), mgy = Math.floor(M.y);
  var wx = mgx - (AW >> 1), wy = mgy - (AW >> 1);
  if (tgx < wx || tgx >= wx + AW || tgy < wy || tgy >= wy + AW){
    M.useGreedy = true;                                // §7: greedy beyond window
    M.pathLen = 0;
    return 0;
  }
  if (cellAt(tgx, tgy) !== 0){ M.pathLen = 0; return 0; }  // wall target: no path
  var len = astar(mgx, mgy, tgx, tgy);
  M.pathLen = len;
  M.pathPos = len > 1 ? 1 : 0;
  return len;
}
function followPath(speed, dt){
  if (M.pathLen === 0 || M.pathPos >= M.pathLen){ M.arrived = true; return; }
  M.arrived = false;
  var tx = asPX[M.pathPos] + 0.5, ty = asPY[M.pathPos] + 0.5;
  var dx = tx - M.x, dy = ty - M.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  var step = speed * dt;
  if (d <= step + 0.08){ M.pathPos++; }
  else moveCollide(M, dx / d * step, dy / d * step, TUNE.M_RAD);
}
function greedyMove(tx, ty, speed, dt){
  var dx = tx - M.x, dy = ty - M.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d < 0.05) return;
  if (M.detourT > 0){                                  // stuck sidestep
    M.detourT -= dt;
    moveCollide(M, -dy / d * M.detourSign * speed * dt, dx / d * M.detourSign * speed * dt, TUNE.M_RAD);
    return;
  }
  moveCollide(M, dx / d * speed * dt, dy / d * speed * dt, TUNE.M_RAD);
}
/* stuck detection: no progress while trying to move */
function monsterStuckCheck(speed, dt){
  var mdx = M.x - M.lastX, mdy = M.y - M.lastY;
  M.lastX = M.x; M.lastY = M.y;
  if (mdx * mdx + mdy * mdy < speed * dt * speed * dt * 0.25){
    M.stuckT += dt;
  } else M.stuckT = 0;
  if (M.stuckT > 1.2){
    M.stuckT = 0;
    if (M.useGreedy){ M.detourT = 0.7; M.detourSign = -M.detourSign; }
    else M.pathLen = 0;                                // force repath
  }
}
function monsterAnim(speed, dt){
  M.animT += dt * speed * 0.5;
  M.frame = (M.animT | 0) % 3;
}
function enterChase(){
  if (M.state !== 'CHASE') AU.sting();
  M.state = 'CHASE';
  M.repathT = 0; M.lostT = 0;
  M.lastKX = P.x; M.lastKY = P.y;
}
function enterSearch(){
  M.state = 'SEARCH';
  M.searchT = 0; M.searchPhase = 0; M.sweeps = 2;
  pathTo(Math.floor(M.lastKX), Math.floor(M.lastKY));
}
function trySpawnMonster(){
  var best = null, bestScore = -1, i;
  for (i = 0; i < 40; i++){
    var ang = Math.random() * Math.PI * 2;
    var d = TUNE.SPAWN_MIN + Math.random() * (TUNE.SPAWN_MAX - TUNE.SPAWN_MIN);
    var sx = P.x + Math.cos(ang) * d, sy = P.y + Math.sin(ang) * d;
    if (cellAt(Math.floor(sx), Math.floor(sy)) !== 0) continue;
    if (los(P.x, P.y, sx, sy)) continue;               // §7: no LOS at spawn
    var score = (2 - lightRaw(Math.floor(sx), Math.floor(sy))) * 10 + Math.random();
    if (score > bestScore){ bestScore = score; best = { x: sx, y: sy }; }
  }
  if (best){
    M.active = true; M.neverSpawned = false;
    M.x = best.x; M.y = best.y;
    M.state = 'ROAM'; M.pathLen = 0; M.despawnT = 0; M.lostT = 0; M.stuckT = 0;
    M.lastX = M.x; M.lastY = M.y;
  }
}
function monsterUpdate(dt){
  if (!M.active){
    if (M.respawnT > 0){
      M.respawnT -= dt;
      if (M.respawnT <= 0) trySpawnMonster();
      return;
    }
    if (M.neverSpawned && G.graceT > 0 && P.odom < TUNE.ODO_SPAWN){
      G.graceT -= dt;
      return;
    }
    trySpawnMonster();
    return;
  }
  var dx = P.x - M.x, dy = P.y - M.y;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > TUNE.DESPAWN_D){
    M.despawnT += dt;
    if (M.despawnT > TUNE.DESPAWN_T){ M.active = false; M.respawnT = 3; M.pathLen = 0; return; }
  } else M.despawnT = 0;

  var seeP = los(M.x, M.y, P.x, P.y);
  if (seeP){ M.lastKX = P.x; M.lastKY = P.y; }
  var hears = P.sprinting && dist < TUNE.HEAR_D;        // through walls (§7)

  if (M.state === 'ROAM'){
    if (M.pathLen === 0 || M.arrived){
      // pick a random reachable cell nearby
      var tries = 0, tgy2, tgx2;
      while (tries++ < 8){
        tgx2 = Math.floor(M.x) + (Math.random() * 16 - 8) | 0;
        tgy2 = Math.floor(M.y) + (Math.random() * 16 - 8) | 0;
        if (cellAt(tgx2, tgy2) !== 0) continue;
        if (pathTo(tgx2, tgy2) > 1) break;
        M.pathLen = 0;
      }
      if (M.pathLen === 0) M.waitT = 0.5 + Math.random() * 1.5;
    }
    if (M.waitT > 0){ M.waitT -= dt; }
    else followPath(TUNE.M_ROAM, dt);
    monsterStuckCheck(TUNE.M_ROAM, dt);
    monsterAnim(TUNE.M_ROAM, dt);
    if (seeP || dist < 3 || hears) enterChase();
  }
  else if (M.state === 'CHASE'){
    M.repathT -= dt;
    var pcx = Math.floor(P.x), pcy = Math.floor(P.y);
    if (M.repathT <= 0 || (seeP && (pcx !== M.targetCX || pcy !== M.targetCY))){
      M.repathT = TUNE.REPATH;
      M.targetCX = pcx; M.targetCY = pcy;
      pathTo(seeP ? pcx : Math.floor(M.lastKX), seeP ? pcy : Math.floor(M.lastKY));
    }
    if (M.useGreedy) greedyMove(M.lastKX, M.lastKY, TUNE.M_CHASE, dt);
    else followPath(TUNE.M_CHASE, dt);
    monsterStuckCheck(TUNE.M_CHASE, dt);
    monsterAnim(TUNE.M_CHASE, dt);
    if (!seeP){
      M.lostT += dt;
      if (M.lostT > TUNE.LOSE_T) enterSearch();
    } else M.lostT = 0;
  }
  else { // SEARCH
    M.searchT += dt;
    if (M.searchPhase === 0){
      if (M.useGreedy){                    // last-known outside A* window
        greedyMove(M.lastKX, M.lastKY, TUNE.M_ROAM, dt);
        var gdx = M.lastKX - M.x, gdy = M.lastKY - M.y;
        if (gdx * gdx + gdy * gdy < 0.25){ M.searchPhase = 1; M.waitT = TUNE.SEARCH_WAIT; }
      } else {
        followPath(TUNE.M_ROAM, dt);
        if (M.arrived || M.pathLen === 0){ M.searchPhase = 1; M.waitT = TUNE.SEARCH_WAIT; }
      }
    } else if (M.searchPhase === 1){
      M.waitT -= dt;
      if (M.waitT <= 0){
        M.searchPhase = 2;
        var tgx3 = Math.floor(M.lastKX) + (Math.random() * 10 - 5) | 0;
        var tgy3 = Math.floor(M.lastKY) + (Math.random() * 10 - 5) | 0;
        if (cellAt(tgx3, tgy3) !== 0 || pathTo(tgx3, tgy3) <= 1) M.sweeps--;
      }
    } else {
      followPath(TUNE.M_ROAM, dt);
      if (M.arrived || M.pathLen === 0){
        M.sweeps--;
        if (M.sweeps > 0){
          var tgx4 = Math.floor(M.lastKX) + (Math.random() * 10 - 5) | 0;
          var tgy4 = Math.floor(M.lastKY) + (Math.random() * 10 - 5) | 0;
          if (cellAt(tgx4, tgy4) !== 0 || pathTo(tgx4, tgy4) <= 1) M.sweeps--;
        }
      }
    }
    monsterAnim(TUNE.M_ROAM, dt);
    if (M.searchT > TUNE.SEARCH_T || M.sweeps <= 0){ M.state = 'ROAM'; M.pathLen = 0; M.waitT = 0.5; }
    if (seeP || dist < 3 || hears) enterChase();
  }
  if (dist < TUNE.CATCH_D && G.catchT === 0) startCatch();
}

/* ==================================================== §8 audio (all synthesized) */
var G = { mode: 'title', tier: 0, time: 0, flicker: 1, graceT: TUNE.GRACE,
          catchT: 0, catchA0: 0, catchD: 0, mute: false, fpsShow: false,
          fpsEMA: 60, autoFrames: 0, autoT: 0, lastTierChange: -1e9,
          logT: 0, pruneT: 0, lastStam: -1,
          bb: { next: TUNE.BB_MIN, until: 0, active: false } };

var AU = {
  ac: null, master: null, humG: null, humBase: 0.03, monG: null, monOsc: null,
  noiseBuf: null, inited: false, nextKnock: 0, tacc: 0,
  init: function(){
    if (this.inited) return;
    this.inited = true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ac = this.ac = new AC();
    this.master = ac.createGain();
    this.master.gain.value = G.mute ? 0 : 1;
    this.master.connect(ac.destination);
    var nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    var d = nb.getChannelData(0), i;
    for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = nb;
    // fluorescent hum: two detuned oscillators + lowpassed noise, slow wobble
    var humG = this.humG = ac.createGain();
    humG.gain.value = this.humBase;
    humG.connect(this.master);
    var o1 = ac.createOscillator(); o1.type = 'sine'; o1.frequency.value = 100;
    var g1 = ac.createGain(); g1.gain.value = 0.5; o1.connect(g1); g1.connect(humG); o1.start();
    var o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = 120.7;
    var g2 = ac.createGain(); g2.gain.value = 0.4; o2.connect(g2); g2.connect(humG); o2.start();
    var ns = ac.createBufferSource(); ns.buffer = nb; ns.loop = true;
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
    var g3 = ac.createGain(); g3.gain.value = 0.5;
    ns.connect(lp); lp.connect(g3); g3.connect(humG); ns.start();
    var lfo = ac.createOscillator(); lfo.frequency.value = 0.33;
    var lg = ac.createGain(); lg.gain.value = 0.008;
    lfo.connect(lg); lg.connect(humG.gain); lfo.start();
    // monster: low drone, gain mapped to proximity
    var monG = this.monG = ac.createGain(); monG.gain.value = 0; monG.connect(this.master);
    var mo = this.monOsc = ac.createOscillator(); mo.type = 'sawtooth'; mo.frequency.value = 52;
    var mlp = ac.createBiquadFilter(); mlp.type = 'lowpass'; mlp.frequency.value = 300;
    mo.connect(mlp); mlp.connect(monG); mo.start();
  },
  ok: function(){ return this.ac && this.ac.state === 'running'; },
  burst: function(dur, filtType, freq, q, vol, rampTo){
    if (!this.ok()) return;
    var ac = this.ac, t = ac.currentTime;
    var src = ac.createBufferSource(); src.buffer = this.noiseBuf;
    src.playbackRate.value = 0.9 + Math.random() * 0.2;
    var f = ac.createBiquadFilter(); f.type = filtType;
    f.frequency.setValueAtTime(freq, t);
    if (rampTo) f.frequency.exponentialRampToValueAtTime(rampTo, t + dur);

    var g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 1.5, dur + 0.05);
    src.stop(t + dur + 0.05);
  },
  step: function(sprint){ this.burst(0.09, 'bandpass', 300 + Math.random() * 300, 1.2, sprint ? 0.16 : 0.08, 0); },
  knock: function(vol){ this.burst(0.16, 'lowpass', 260, 1, vol, 0); },
  whoosh: function(){ this.burst(1.2, 'lowpass', 3000, 0.8, 0.3, 80); },
  sting: function(){
    if (!this.ok()) return;
    var ac = this.ac, t = ac.currentTime;
    var o = ac.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(58, t);
    o.frequency.exponentialRampToValueAtTime(165, t + 0.5);
    var g = ac.createGain();
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + 0.75);
    this.burst(0.3, 'lowpass', 500, 1, 0.22, 0);
  },
  update: function(dt){
    if (!this.ok()) return;
    this.tacc -= dt;
    if (this.tacc > 0) return;
    this.tacc = 0.1;
    var t = this.ac.currentTime;
    // hum drops with flicker (§8 blackout)
    this.humG.gain.setTargetAtTime(this.humBase * (0.4 + 0.6 * G.flicker), t, 0.08);
    var g = 0;
    if (M.active){
      var d2 = (M.x - P.x) * (M.x - P.x) + (M.y - P.y) * (M.y - P.y);
      g = 0.5 / (1 + d2 * 0.09);                    // audible before you see it
      if (g > 0.32) g = 0.32;
      this.monG.gain.setTargetAtTime(g, t, 0.15);
      this.monOsc.frequency.setTargetAtTime(M.state === 'CHASE' ? 63 : 50, t, 0.3);
      if (t > this.nextKnock){
        this.nextKnock = t + 2 + Math.random() * 5;
        this.knock(Math.min(0.4, g * 2 + 0.03));
      }
    } else this.monG.gain.setTargetAtTime(0, t, 0.3);
  }
};

/* ------------------------------------------------------------- §10 game flow */
var $id = function(id){ return document.getElementById(id); };
var stamF = $id('stamF'), fpsOv = $id('fpsOv'), seedLbl = $id('seedLbl');
var titleOv = $id('titleOv'), pauseOv = $id('pauseOv'), deadOv = $id('deadOv'), fadeOv = $id('fadeOv');

function startGame(seedStr){
  /* audio must never block the game: no-audio-device (VM/RDP) throws here */

    AU.init();
    if (AU.ac && AU.ac.state === 'suspended') AU.ac.resume();
  } catch (e) { AU.ac = null; AU.inited = true; __errs.push('error: audio init ' + e); }

    resetWorld(seedFromString(seedStr));
  } catch (e) {
    __errs.push('error: world init ' + e);

  }
  G.mode = 'play';
  titleOv.classList.add('hidden');
  deadOv.classList.add('hidden');
  pauseOv.classList.add('hidden');
  requestLock();
}
function pauseGame(){
  if (G.mode !== 'play') return;
  G.mode = 'pause';
  pauseOv.classList.remove('hidden');
}
function resumeGame(){
  if (G.mode !== 'pause') return;
  pauseOv.classList.add('hidden');
  G.mode = 'play';
  requestLock();
}
function gameOver(){
  G.mode = 'dead';
  deadOv.classList.remove('hidden');
  if (document.exitPointerLock) document.exitPointerLock();
}
function restart(sameSeed){
  resetWorld(sameSeed ? worldSeed : (Math.random() * 0xffffffff) >>> 0);
  G.mode = 'play';
  deadOv.classList.add('hidden');
  pauseOv.classList.add('hidden');
  requestLock();
}
function toggleMute(){
  G.mute = !G.mute;
  if (AU.master) AU.master.gain.value = G.mute ? 0 : 1;
  $id('muteBtn').textContent = G.mute ? 'UNMUTE' : 'MUTE';
}
function requestLock(){
  try {
    var p = cv.requestPointerLock();
    if (p && p.catch) p.catch(function(){});
  } catch (e) { __errs.push('error: pointer lock ' + e); }
}

/* ------------------------------------------------- §4.4 flicker & blackouts */
function flickerUpdate(dt){
  G.time += dt;
  var bb = G.bb;
  if (!bb.active && G.time >= bb.next){
    bb.active = true;
    bb.until = G.time + TUNE.BB_DUR_MIN + Math.random() * TUNE.BB_DUR_VAR;
    AU.whoosh();
    if (M.active && M.state !== 'CHASE' && Math.random() < 0.6) blackoutTeleport();
  }
  if (bb.active && G.time >= bb.until){
    bb.active = false;
    bb.next = G.time + TUNE.BB_MIN + Math.random() * TUNE.BB_VAR;
  }
  var f = 1 + 0.08 * Math.sin(G.time * 1.7) * Math.sin(G.time * 2.9 + 1.7);
  if (bb.active) f *= TUNE.BB_LIGHT;
  G.flicker = f;
}
function blackoutTeleport(){
  for (var i = 0; i < 30; i++){
    var ang = Math.random() * Math.PI * 2;
    var d = 8 + Math.random() * 6;
    var sx = P.x + Math.cos(ang) * d, sy = P.y + Math.sin(ang) * d;
    if (cellAt(Math.floor(sx), Math.floor(sy)) !== 0) continue;
    if (los(P.x, P.y, sx, sy)) continue;
    M.x = sx; M.y = sy; M.pathLen = 0; M.stuckT = 0; M.lastX = sx; M.lastY = sy;
    return;
  }
}

/* ------------------------------------------------------- §9 quality auto-drop */
function tierAutoCheckAvg(avgFps){
  if (G.tier === 0 && avgFps < TUNE.TIER_FPS2) return 2;
  if (G.tier === 1 && avgFps < TUNE.TIER_FPS3) return 3;
  return -1;
}
function tierAutoCheck(dt){
  G.autoFrames++;
  G.autoT += dt;
  if (G.autoT < TUNE.TIER_WINDOW) return;
  var avg = G.autoFrames / G.autoT;
  G.autoFrames = 0; G.autoT = 0;
  var n = tierAutoCheckAvg(avg);
  if (n > 0 && G.time - G.lastTierChange >= TUNE.TIER_HYST){
    G.lastTierChange = G.time;
    setTier(n - 1);
  }
}

/* ------------------------------------------------------------------- HUD */
function hudUpdate(dt){
  hudUpdate.t -= dt;
  if (hudUpdate.t > 0) return;
  hudUpdate.t = 0.15;
  var w = (P.stamina * 100) | 0;
  if (w !== G.lastStam){
    G.lastStam = w;
    stamF.style.width = w + '%';
  }
  if (G.fpsShow){
    fpsOv.textContent = (G.fpsEMA | 0) + ' fps  tier ' + (G.tier + 1) +
      '  chunks ' + chunks.size + '  a* ' + DBG.astarMaxNodes +
      '\nmon ' + (M.active ? M.state : '-') + '  seed ' + worldSeed.toString(16);
  }
}

/* ------------------------------------------------------------- §7 catch seq */
function startCatch(){
  G.catchT = 0.0001;
  var d = Math.atan2(M.y - P.y, M.x - P.x) - P.a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  G.catchA0 = P.a; G.catchD = d;
}

/* -------------------------------------------------------------- input (§6) */
var NEED_PREVENT = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,
                     Space: 1, KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1 };
document.addEventListener('keydown', function(e){
  if (e.target === $id('seedInp')) return;
  if (NEED_PREVENT[e.code]) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  try { AU.init(); if (AU.ac && AU.ac.state === 'suspended') AU.ac.resume(); } catch (e2) { AU.ac = null; AU.inited = true; }
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'KeyF'){ G.fpsShow = !G.fpsShow; fpsOv.style.display = G.fpsShow ? 'block' : 'none'; }
  if (e.code === 'Digit1') setTier(0);
  if (e.code === 'Digit2') setTier(1);
  if (e.code === 'Digit3') setTier(2);
  if (G.mode === 'dead'){
    if (e.code === 'KeyR') restart(true);
    if (e.code === 'Enter') restart(false);
  } else if (G.mode === 'title' && e.code === 'Enter'){ startGame($id('seedInp').value); }
});
document.addEventListener('keyup', function(e){ keys[e.code] = false; });
cv.addEventListener('mousemove', function(e){
  if (document.pointerLockElement === cv && G.mode === 'play' && G.catchT === 0){
    P.a += e.movementX * TUNE.MOUSE_SENS;
  }
});
cv.addEventListener('click', function(){
  if (G.mode === 'play' && document.pointerLockElement !== cv) requestLock();
});
document.addEventListener('pointerlockchange', function(){
  if (document.pointerLockElement !== cv && G.mode === 'play' && G.catchT === 0) pauseGame();
});
$id('startBtn').addEventListener('click', function(){ startGame($id('seedInp').value); });
$id('resumeBtn').addEventListener('click', resumeGame);
$id('restartBtn').addEventListener('click', function(){ restart(true); });
$id('muteBtn').addEventListener('click', toggleMute);

/* ------------------------------------------------- world integrity prober (audit) */
function collectOpenings(ch){
  var cx = ch.cx, cy = ch.cy, opens = [], pw, e;
  pw = openingsFor(true, cx, cy);     for (e = 0; e < pw.length; e++) opens.push(pw[e] << 4);
  pw = openingsFor(true, cx + 1, cy); for (e = 0; e < pw.length; e++) opens.push((pw[e] << 4) + 15);
  pw = openingsFor(false, cy, cx);    for (e = 0; e < pw.length; e++) opens.push(pw[e]);
  pw = openingsFor(false, cy + 1, cx);for (e = 0; e < pw.length; e++) opens.push((15 << 4) + pw[e]);
  return opens;
}
function floodFrom(ch, seed){
  var cells = ch.cells, reached = new Uint8Array(256), stack = [seed];
  reached[seed] = 1;
  while (stack.length){
    var n = stack.pop(), nx = n & 15, ny = n >> 4, d;
    for (d = 0; d < 4; d++){
      var ox = nx + (d === 0 ? 1 : d === 1 ? -1 : 0);
      var oy = ny + (d === 2 ? 1 : d === 3 ? -1 : 0);
      if (ox < 0 || ox > 15 || oy < 0 || oy > 15) continue;
      var q = (oy << 4) + ox;
      if (!reached[q] && cells[q] === 0){ reached[q] = 1; stack.push(q); }
    }
  }
  return reached;
}
/* Generate n+1 chunks straight along row cy and prove: every border opening
   is carved on BOTH sides (pure edge fn agreement) and every chunk's openings
   are mutually connected with no unreachable floor pockets. */
function verifyStrip(n, cy){
  if (cy === undefined) cy = 0;
  cy |= 0;
  var failures = [], i, k;
  for (i = 0; i <= n; i++) chunkGet(i, cy);
  for (i = 0; i <= n; i++){
    var ch = chunkGet(i, cy);
    var opens = collectOpenings(ch);
    var reached = floodFrom(ch, opens[0]);
    for (k = 0; k < opens.length; k++)
      if (!reached[opens[k]]) failures.push('chunk ' + i + ': opening ' + k + ' disconnected');
    for (k = 0; k < 256; k++)
      if (ch.cells[k] === 0 && !reached[k]){ failures.push('chunk ' + i + ': unreachable floor pocket'); break; }
    if (i < n){
      var nxt = chunkGet(i + 1, cy);
      var pw = openingsFor(true, i + 1, cy), e;
      for (e = 0; e < pw.length; e++){
        if (ch.cells[(pw[e] << 4) + 15] !== 0 || nxt.cells[pw[e] << 4] !== 0)
          failures.push('edge opening not carved both sides: chunks ' + i + '/' + (i + 1) + ' row ' + pw[e]);
      }
    }
  }
  return { chunks: n + 1, failures: failures, ok: failures.length === 0 };
}

/* ------------------------------------------------------------- main loop (§3.1) */
var lastTs = 0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt <= 0) return;
  if (dt > 0.1) dt = 0.1;                                  // §6 dt clamp
  G.fpsEMA = G.fpsEMA * 0.9 + (1 / dt) * 0.1;
  if (G.mode === 'play'){
    flickerUpdate(dt);
    if (G.catchT > 0){
      G.catchT += dt;
      var k = G.catchT;
      if (k > 1) k = 1;
      P.a = G.catchA0 + G.catchD * k * k;                  // 1 s camera snap
      fadeOv.style.opacity = (k * k * 0.92).toFixed(2);
      if (G.catchT >= 1) gameOver();
    } else {
      playerUpdate(dt);
      monsterUpdate(dt);
    }
    tierAutoCheck(dt);
    hudUpdate(dt);
    G.logT += dt;
    if (G.logT > 5){ G.logT = 0; logWorld(); }
    G.pruneT += dt;
    if (G.pruneT > 2){ G.pruneT = 0; pruneChunks(); }
    AU.update(dt);
  }
  if (G.mode === 'play' || G.mode === 'pause' || G.mode === 'dead') renderFrame();
}

/* -------------------------------------------------------- L0 instrumentation */
window.L0 = {
  stats: function(){
    var md = Math.sqrt((M.x - P.x) * (M.x - P.x) + (M.y - P.y) * (M.y - P.y));
    return { fps: G.fpsEMA | 0, tier: G.tier + 1, chunks: chunks.size,
             chunkGens: DBG.gens, astarMax: DBG.astarMaxNodes,
             astarOverflows: DBG.astarOverflows, astarCalls: DBG.astarCalls,
             mode: G.mode, pos: [P.x.toFixed(2), P.y.toFixed(2)],
             monster: M.active ? { state: M.state, dist: +md.toFixed(2), x: M.x, y: M.y } : null,
             errorCount: __errs.length, seed: worldSeed >>> 0, time: G.time };
  },
  cell: function(x, y){ return cellAt(Math.floor(+x), Math.floor(+y)); },
  los: function(ax, ay, bx, by){ return los(+ax, +ay, +bx, +by); },
  tp: function(x, y, a){ P.x = +x; P.y = +y; if (a !== undefined) P.a = +a; },
  tpMon: function(x, y){ M.x = +x; M.y = +y; M.active = true; M.neverSpawned = false; },
  press: function(code, down){ keys[code] = down !== false; },   // test input hook
  setTier: function(n){ setTier(n - 1); },
  autoCheck: tierAutoCheckAvg,
  seed: function(){ return worldSeed >>> 0; },
  start: function(s){ startGame(s === undefined ? '' : s); },
  verify: verifyStrip,
  errors: function(){ return __errs.slice(); },
  G: G, M: M, P: P, TEX: TEX, TUNE: TUNE, DBG: DBG
};

/* ------------------------------------------------------------------- boot */
genTextures();
genSprites();
setTier(0);
resetWorld((Math.random() * 0xffffffff) >>> 0);
G.mode = 'title';
requestAnimationFrame(loop);
</script>
